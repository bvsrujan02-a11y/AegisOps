apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegis-service-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/bvsrujan02-a11y/AegisOps.git'
    targetRevision: HEAD
    path: charts/Aegis-service
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.repository
          value: srujan078/aegis-app
        - name: image.tag
          value: "1.0.0"
        - name: image.pullPolicy
          value: IfNotPresent
        - name: replicaCount
          value: "1"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: aegis-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
