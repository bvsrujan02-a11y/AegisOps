replicaCount: 5

image:
  repository: ghcr.io/your-org/aegis-app
  pullPolicy: IfNotPresent
  tag: "initial-bootstrap-tag"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

canary:
  initialWeight: 20
  pauseDuration: 3m
  nextWeight: 50
  secondaryPause: 5m
