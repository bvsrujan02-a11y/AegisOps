apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Release.Name }}-error-rate-check
spec:
  metrics:
    - name: error-rate
      interval: 30s
      successCondition: result[0] <= 0.01
      failureLimit: 2
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            sum(rate(http_requests_total{status=~"5.*",app="{{ .Release.Name }}"}[1m])) 
            / 
            sum(rate(http_requests_total{app="{{ .Release.Name }}"}[1m]))
